# Same environment as concierge.yaml but bootstrapped with Juju 4.
# Used by the `integration-test-juju4` spread backend.

juju:
  channel: 4/stable
  # The default 20-minute bootstrap timeout is too short for the controller
  # pod to expose its API on slow CI runners.
  extra-bootstrap-args: --config bootstrap-timeout=1800
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.32-classic/stable
    bootstrap-constraints:
      root-disk: "2G"
    features:
      load-balancer:
        l2-mode: "true"
        cidrs: "10.43.45.0/28"
      local-storage: {}
      network: {}

host:
  packages:
    - skopeo
