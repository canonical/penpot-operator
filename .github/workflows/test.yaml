name: Tests

on:
  pull_request:
  schedule:
  - cron: "0 15 * * SAT"

jobs:
  unit-tests:
    uses: canonical/operator-workflows/.github/workflows/test.yaml@main
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      charmcraft-channel: latest/edge
      vale-style-check: false
      with-uv: true
  integration-tests:
    uses: canonical/charm-ci/.github/workflows/integration-test.yml@main
    permissions:
      contents: read
      packages: write
      actions: read
    secrets: inherit
    with:
      working-directory: .
      charmcraft-channel: latest/edge
      # The penpot rock builds the frontend/backend from source.
      build-timeout-minutes: 180
      test-timeout-minutes: 120
  required_status_checks:
    name: Required Integration Test Status Checks
    runs-on: ubuntu-latest
    needs:
      - integration-tests
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - name: Check integration-test status
        run: |
          RESULT="${{ needs.integration-tests.result }}"
          if [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]; then
            exit 0
          else
            echo "integration-test failed with status: $RESULT"
            exit 1
          fi
